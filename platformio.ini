; PlatformIO project for the BambuLab Status Bar
; https://docs.platformio.org/page/projectconf.html

[env]
lib_deps =
    knolleary/PubSubClient @ ^2.8
    fastled/FastLED @ ^3.10.0
    bblanchon/ArduinoJson @ ^7.1.0
build_flags =
    -D MQTT_MAX_PACKET_SIZE=4096

; ESP32-C6 Super Mini. LEDs on GPIO19, BOOT on GPIO9.
; 4 MB flash with two OTA slots. First install is USB; later updates are the
; web UI "firmware.bin" from `.pio/build/esp32c6/firmware.bin`.
; Stock PlatformIO espressif32 still ships Arduino 2.x, which cannot build
; for the C6. pioarduino tracks Arduino-ESP32 3.x, which can.
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.partitions = partitions_4mb_ota.csv
build_flags =
    ${env.build_flags}
    -D STATUS_LED_PIN=19
    -D STATUS_BOOT_PIN=9

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_4mb_ota.csv
build_flags =
    ${env.build_flags}

; Host-side unit tests for the pure state-machine logic (no ESP32 hardware
; needed). Run with: pio test -e native
; Only PrinterState.{h,cpp} is Arduino/hardware-independent, so that's all
; this environment builds from src/.
[env:native]
platform = native
build_flags =
    -std=c++17
    -D UNIT_TEST
build_src_filter =
    +<*>
    -<main.cpp>
    -<LedController.cpp>
    -<BambuMqttClient.cpp>
    -<Settings.cpp>
    -<WebUi.cpp>
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
